<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bauni Story Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cormorant Garamond', serif;
  background: linear-gradient(135deg,#ffdde1,#ee9ca7);
  overflow:hidden;
}

/* SLIDES */
.slide{
  display:none;
  height:100vh;
  width:100vw;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.slide.active{
  display:flex;
}

/* TEXT */
h1,h2{ font-size:42px; margin:10px; }
p{ font-size:24px; line-height:1.7; max-width:750px; }

/* BUTTONS */
button{
  padding:14px 22px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-size:18px;
  margin:10px;
  background:white;
  font-family:'Cormorant Garamond', serif;
}

/* INPUT */
input{
  padding:12px;
  font-size:18px;
  border-radius:10px;
  border:none;
  text-align:center;
}

/* IMAGE GALLERY */
.image-container{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:15px;
  max-width:800px;
  margin-top:15px;
}

.image-container img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* NO BUTTON FIX */
#noBtn{
  position:fixed;
  z-index:9999;
}

/* HEARTS */
.heart{
  position:absolute;
  color:red;
  animation: floatUp 4s linear forwards;
}

@keyframes floatUp{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-700px);opacity:0;}
}
</style>
</head>

<body>

<!-- 🔐 PASSWORD -->
<div class="slide active" id="s0">
  <h1>🔐 Enter Password</h1>
  <input type="password" id="passInput" placeholder="Password">
  <button onclick="checkPass()">Unlock</button>
  <p id="error"></p>
</div>

<!-- 🟡 SLIDE 2 -->
<div class="slide" id="s1">
  <h2>🤨 Are you the real Bauni?</h2>
  <button onclick="nextSlide()">😝 Yes</button>
  <button id="noBtn">🤥 Nope</button>
</div>

<!-- 🟢 SLIDE 3 -->
<div class="slide" id="s2">
  <h2>📸 Our memories</h2>
  <p>You became my favorite memory 🌸</p>

  <div class="image-container">
    <img src="pic1.jpg">
    <img src="bauni1.png">
    <img src="memory_2.jpg">
  </div>

  <button onclick="nextSlide()">😝 Next</button>
</div>

<!-- 🔵 SLIDE 4 -->
<div class="slide" id="s3">
  <h2>💖 Appreciation</h2>
  <p>You are amazing 🌸</p>

  <button onclick="nextSlide()">😝 Next</button>
</div>

<!-- 🟠 SLIDE 5 -->
<div class="slide" id="s4">
  <h2>😎 Official Notice</h2>
  <p>You are stuck 😆</p>

  <button onclick="nextSlide()">😝 Continue</button>
</div>

<!-- 🔴 FINAL -->
<div class="slide" id="s5">
  <h2>💌 Final Message</h2>
  <p id="finalText"></p>
  <h3>Stay forever 💖</h3>
</div>

<script>

let current=0;
const password="#proudlesbianbauni";

/* PASSWORD */
function checkPass(){
  let inp=document.getElementById("passInput");
  let err=document.getElementById("error");

  if(inp.value===password){
    showSlide(1);
  }else{
    err.innerText="Try again 😆";
  }
}

/* SLIDES */
function showSlide(n){
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
  current=n;
}

function nextSlide(){
  current++;
  showSlide(current);
  if(current===5) typeText();
}

/* 💥 NO BUTTON IMPOSSIBLE MODE */
const noBtn = document.getElementById("noBtn");

function moveNoButton(){
  const padding = 20;

  const maxX = window.innerWidth - noBtn.offsetWidth - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* Desktop */
noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("click", (e)=>{
  e.preventDefault();
  moveNoButton();
});

/* Mobile */
noBtn.addEventListener("touchstart", (e)=>{
  e.preventDefault();
  moveNoButton();
});

/* extra chaos */
setInterval(moveNoButton, 1200);

/* TYPING */
function typeText(){
  const text="You became my favorite part of everything 💖";
  let i=0;
  let el=document.getElementById("finalText");

  let interval=setInterval(()=>{
    el.innerHTML+=text[i];
    i++;
    if(i>=text.length){
      clearInterval(interval);
    }
  },40);
}

</script>

</body>
</html>
